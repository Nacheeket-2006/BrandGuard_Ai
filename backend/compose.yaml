services:
  brandguard:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/brandguard.db
    volumes:
      - brandguard-data:/data
    restart: unless-stopped
volumes:
  brandguard-data:
